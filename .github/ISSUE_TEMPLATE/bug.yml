name: Bug report
description: Report reproducible behavior using sanitized, non-private details.
title: "fix: "
labels: ["bug", "state:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub is public. Use synthetic examples and redact usernames, addresses, recordings, device identifiers, credentials, tokens, and local logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Give minimal steps using synthetic or non-sensitive inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - voice
        - local-runtime
        - integrations
        - privacy
        - docs
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Include only relevant OS or WSL versions; omit usernames, hostnames, and absolute paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I used synthetic inputs and removed personal data, secrets, recordings, and identifying logs or paths.
          required: true
