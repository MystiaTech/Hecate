name: Feature proposal
description: Propose new Hecate behavior without including private home data.
title: "feat: "
labels: ["enhancement", "state:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub is public planning space. Do not include household notes, addresses, recordings, device identifiers, credentials, tokens, or private logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing an unselected implementation.
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap stage
      options:
        - Step Zero
        - Local Voice MVP
        - Core Assistant
        - Future Integrations
        - Not yet assigned
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - voice
        - local-runtime
        - integrations
        - privacy
        - docs
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this complete.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed personal household data, secrets, recordings, and identifying local paths.
          required: true
